server {
    listen 80;
    listen [::]:80;

    server_name dachdeckerberlin24.de www.dachdeckerberlin24.de;

    root /var/www/dachdeckerberlin24.de;
    index index.php index.html;

    client_max_body_size 16m;

    access_log /var/log/nginx/dachdeckerberlin24.de.access.log;
    error_log  /var/log/nginx/dachdeckerberlin24.de.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include snippets/fastcgi-php.conf;
        # Adjust this socket if the server uses another PHP-FPM version.
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Never expose repository/config/secret-related files.
    location ~ /\.git {
        deny all;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* ^/(db\.php|php\.ini|generate-hash\.php|check-permision\.php)$ {
        deny all;
    }

    location ^~ /AI/ {
        deny all;
    }

    # Static asset caching.
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|webp|ico|woff|woff2|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
        access_log off;
    }
}
